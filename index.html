<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Privacy: the page may only load code and data from its own origin.
      connect-src 'self' means the page cannot send anything to any other server.
      'wasm-unsafe-eval' permits compiling WebAssembly (needed by the PDF engine) without allowing JS eval.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="__APP_NAME__" />
    <link rel="apple-touch-icon" href="./__ICON_PREFIX__apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./__ICON_PREFIX__icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>__APP_NAME__</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>PDF Optimizer needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
